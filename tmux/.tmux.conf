# ~/.tmux.conf

##### PLUGINS

set -g @plugin 'tmux-plugins/tpm'

# Git status
# set -g @plugin 'arl/gitmux'

# Pomodoro timer
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# Theme

set -g @plugin 'janoamaral/tokyo-night-tmux'

# Vim navigation

set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# System info

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

##### GENERAL


set -g history-limit 50000

# Better prefix

set -g prefix C-s
bind C-s send-prefix

# Reload config

unbind r
bind r source-file ~/.tmux.conf ; display-message "tmux config reloaded"

# Mouse support

set -g mouse on

# Faster escape sequences

set -sg escape-time 0

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1


# Automatically renumber windows

set -g renumber-windows on

# Vi mode

setw -g mode-keys vi

##### TERMINAL

# Use current shell automatically

set -g default-shell "/usr/bin/fish"

# True color support

set -g default-terminal "tmux-256color"

set -ga terminal-overrides ",xterm-ghostty:Tc"

set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:extkeys"

set -g xterm-keys on

set -s extended-keys on

##### TRANSPARENCY / CLEAN BACKGROUND

set -g status-style bg=default
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

##### PANE BORDERS

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#bb9af7"

##### SPLITS

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### VIM-TMUX NAVIGATOR

set -g @is_vim "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "#{@is_vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "#{@is_vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "#{@is_vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "#{@is_vim}" "send-keys C-l" "select-pane -R"


##### COPY MODE

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### RESURRECT / CONTINUUM

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-hook-post-restore-all 'tmux switch-client -t main'

##### TOKYO NIGHT

set -g @tokyo-night-tmux_theme night

# Transparent status line

set -g @tokyo-night-tmux_transparent 1

# Directory (mirrors old catppuccin directory module)

set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_path_format relative

# Keep it minimal — disable extras the old config didn't show

set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_battery_widget 0

##### STATUS BAR

set -g status-position top
set -g status-justify centre

set -g status-left-length 100
set -g status-right-length 150

##### TPM

run '~/.tmux/plugins/tpm/tpm'

# Pomodoro timer appended after theme loads so it isn't overwritten
set -agF status-right "#{pomodoro_status}"


# Tmux 3.7 status bar fix
#
# set -gF message-style "fg=#7dcfff,bg=#1a1b26,fill=#1a1b26"
# set -gF message-command-style "fg=#7dcfff,bg=#1a1b26,fill=#1a1b26"

set -gF message-style "fg=#1a1b26,bg=#c0caf5,fill=#c0caf5"
set -gF message-command-style "fg=#1a1b26,bg=#c0caf5,fill=#c0caf5"
