# ~/.tmux.conf

##### PLUGINS

set -g @plugin 'tmux-plugins/tpm'

# Git status
set -g @plugin 'arl/gitmux'

# Pomodoro timer
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# Theme

set -g @plugin 'catppuccin/tmux#v2.3.0'

# Vim navigation

set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# System info

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

##### GENERAL


# Better prefix

set -g prefix C-s
bind C-s send-prefix

# Reload config

unbind r
bind r source-file ~/.tmux.conf ; display-message "tmux config reloaded"

# Mouse support

set -g mouse on

# Faster escape sequences

set -sg escape-time 0

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1


# Automatically renumber windows

set -g renumber-windows on

# Vi mode

setw -g mode-keys vi

##### TERMINAL

# Use current shell automatically

set -g default-shell "/usr/bin/fish"

# True color support

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",ghostty:Tc"

set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",ghostty:extkeys"

set -g xterm-keys on
set -s extended-keys on

##### TRANSPARENCY / CLEAN BACKGROUND

set -g status-style bg=default
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

##### PANE BORDERS

set -g pane-border-style "fg=#{@thm_surface_1}"
set -g pane-active-border-style "fg=#{@thm_lavender}"

##### SPLITS

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### VIM-TMUX NAVIGATOR

set -g @is_vim "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "#{@is_vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "#{@is_vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "#{@is_vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "#{@is_vim}" "send-keys C-l" "select-pane -R"


##### COPY MODE

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### RESURRECT / CONTINUUM

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

##### CATPPUCCIN

set -g @catppuccin_flavor "mocha"

# Transparent status line

set -g @catppuccin_status_background "#1e1e2e"

# Window style

set -g @catppuccin_window_status_style "rounded"

# Window text

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Active window colors

set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"
#
# # Inactive window colors
#
set -g @catppuccin_window_text_color "#{@thm_overlay_0}"
set -g @catppuccin_window_number_color "#{@thm_overlay_1}"


# Window flags

set -g @catppuccin_window_flags "icon"

##### STATUS BAR

set -g status-position top
set -g status-justify centre

set -g status-left-length 100
set -g status-right-length 150

# Separators

set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_middle_separator " │ "
set -g @catppuccin_status_connect_separator "no"

##### MODULE CUSTOMIZATION

# Session

set -g @catppuccin_session_icon "󰙯 "
set -g @catppuccin_session_color "#{@thm_mauve}"

# Directory

set -g @catppuccin_directory_icon " "
set -g @catppuccin_directory_color "#{@thm_blue}"

##### STATUS MODULES

# LEFT

set -g status-left "#{E:@catppuccin_status_session}"

# RIGHT

set -g status-right "#{E:@catppuccin_status_directory}"

# Git branch/status
set -ag status-right "#{E:@catppuccin_status_gitmux}"
set -g @catppuccin_gitmux_color "#{@thm_teal}"
set -g @catppuccin_gitmux_icon "󰊢 "
set -g @catppuccin_gitmux_text "#(gitmux -cfg $HOME/.gitmux.conf \"#{pane_current_path}\")"

# Pomodoro
set -agF status-right "#{E:@catppuccin_status_pomodoro_plus}"

##### TPM

run '~/.tmux/plugins/tpm/tpm'

